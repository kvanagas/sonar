name: Sonar
options:
  bundleIdPrefix: com.karolisvanagas
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: XNZ6USZQ48
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    # Required for notarization; audio capture and Apple Events are allowed in Sonar.entitlements.
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Sonar:
    type: application
    platform: macOS
    sources: [Sonar]
    dependencies:
      - package: Sparkle
    info:
      path: Sonar/Info.plist
      properties:
        CFBundleDisplayName: Sonar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
        NSAudioCaptureUsageDescription: Sonar listens to system audio to detect the tempo (BPM) of the track that is playing. Audio is analysed locally and never stored.
        NSAppleEventsUsageDescription: Sonar asks Spotify or Music which track is playing, and your browser which page is playing audio, so it can show and save the song with its BPM.
        # Sparkle updates: the feed is attached to each GitHub release; updates are
        # signed with the EdDSA key whose public half is below (private half in the keychain).
        SUFeedURL: https://github.com/kvanagas/sonar/releases/latest/download/appcast.xml
        SUPublicEDKey: RQBUWOS86wdd75V/R6CfycGp8zOplrfPxZmuWVtXwzc=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karolisvanagas.sonar
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sonar/Sonar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SonarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SonarTests
      - Sonar/Tempo
      - Sonar/NowPlaying
      - Sonar/History/TrackStore.swift
      - Sonar/History/BrowserPage.swift
      - Sonar/Identify/MatchScheduler.swift
      - Sonar/Identify/SongMatching.swift
      - Sonar/UI/NotchLayout.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karolisvanagas.sonar.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sonar:
    build:
      targets:
        Sonar: all
        SonarTests: [test]
    test:
      targets: [SonarTests]
