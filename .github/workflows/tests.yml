name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The tests compile the sources directly, so no signing is needed here.
      - name: Run tests
        run: |
          xcodebuild test \
            -project Sonar.xcodeproj -scheme Sonar -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
